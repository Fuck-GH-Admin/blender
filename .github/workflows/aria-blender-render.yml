name: AriaIdol Blender 8-render ablation

on:
  push:
    branches:
      - ops/aria-blender-transfer-20261124
    paths:
      - ".github/workflows/aria-blender-render.yml"
      - "scripts/aria_blender_ablation.py"

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated transfer branch
        uses: actions/checkout@v4
        with:
          ref: ops/aria-blender-transfer-20261124
          fetch-depth: 1
          sparse-checkout: |
            scripts/aria_blender_ablation.py
          sparse-checkout-cone-mode: false

      - name: Download verified Blender and AriaIdol inputs
        uses: actions/download-artifact@v4
        with:
          name: aria-blender-inputs-45411674206
          run-id: 45411674206
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/aria-inputs

      - name: Install headless render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 \
            libxext6 libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri libxrandr2 \
            libxxf86vm1 libxcursor1 libxinerama1 libwayland-client0 libdecor-0-0 \
            xvfb xz-utils unzip python3-pil
          mkdir -p "${{ runner.temp }}/blender" "${{ runner.temp }}/pmx"
          tar -xf "${{ runner.temp }}/aria-inputs/blender/blender-5.3.0-linux-x64.tar.xz" \
            -C "${{ runner.temp }}/blender"
          BLENDER="$(find "${{ runner.temp }}/blender" -type f -name blender -perm -111 | head -1)"
          test -x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          "$BLENDER" --version | head -5
          sha256sum "${{ runner.temp }}/aria-inputs/blender/blender-5.3.0-linux-x64.tar.xz"
          ldd "$BLENDER" | grep "not found" && exit 1 || true

      - name: Extract PMX release model
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq "${{ runner.temp }}/aria-inputs/repo/05_官方模型/爱芮_人形_PMX_官模原包.zip" \
            -d "${{ runner.temp }}/pmx"
          PMX_FILE="$(find "${{ runner.temp }}/pmx" -type f -name '爱芮.pmx' -print -quit)"
          test -n "$PMX_FILE"
          test -s "$PMX_FILE"
          echo "PMX_FILE=$PMX_FILE" >> "$GITHUB_ENV"
          find "$(dirname "$PMX_FILE")" -maxdepth 2 -type f | head -40

      - name: Render four model/material conditions in EEVEE and Cycles
        shell: bash
        run: |
          set -euo pipefail
          INPUTS="${{ runner.temp }}/aria-inputs"
          OUT="$GITHUB_WORKSPACE/aria-ablation-out"
          mkdir -p "$OUT"
          GLB="$INPUTS/repo/04_站点镜像/models/aria/model.glb"
          CONTRACT="$INPUTS/repo/04_站点镜像/contracts/00c580250fd8f42691f75cab6fbea3d5c45760f9f84bddc861e271ccbe152072.json"
          TEXTURES="$INPUTS/repo/04_站点镜像/textures"
          test -s "$GLB"; test -s "$CONTRACT"; test -s "$PMX_FILE"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER" -b -t 4 \
            --python-exit-code 1 \
            --python scripts/aria_blender_ablation.py -- \
            --pmx "$PMX_FILE" --glb "$GLB" --contract "$CONTRACT" \
            --textures "$TEXTURES" --out "$OUT" --width 1024 --height 1536 2>&1 | tee "$OUT/blender-render.log"
          ls -lh "$OUT"

      - name: Validate eight independent preview renders and create gallery
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/aria-ablation-out"
          python3 - "$OUT" <<'PY'
          from PIL import Image, ImageStat
          import os, sys, json, html
          out=sys.argv[1]
          variants=[
            ("pmx_base","PMX 基础材质"),
            ("pmx_tuned","PMX 分部位材质"),
            ("glb_imported","GLB 原始导入材质"),
            ("glb_native_dn","GLB 原生 D/N + 分部位材质"),
          ]
          engines=["eevee","cycles"]
          expected=(1024,1536)
          records=[]
          cards=[]
          for key,label in variants:
            for engine in engines:
              name=f"{key}_{engine}.png"
              path=os.path.join(out,name)
              if not os.path.isfile(path):
                raise SystemExit(f"MISSING_RENDER: {name}")
              im=Image.open(path)
              im.verify()
              im=Image.open(path).convert("RGB")
              if im.size != expected:
                raise SystemExit(f"BAD_DIMENSIONS: {name}: {im.size}, expected {expected}")
              sample=im.resize((128,192))
              stat=ImageStat.Stat(sample)
              colors=sample.getcolors(maxcolors=30000)
              color_count=len(colors) if colors is not None else 30000
              stddev=[round(v,2) for v in stat.stddev]
              if os.path.getsize(path)<10000 or color_count<100 or max(stddev)<3:
                raise SystemExit(f"LIKELY_BLANK_OR_CORRUPT: {name}")
              records.append({
                "file":name,"variant":key,"label":label,"engine":engine,
                "width":im.width,"height":im.height,"bytes":os.path.getsize(path),
                "sample_unique_colors":color_count,"sample_stddev_rgb":stddev
              })
              cards.append(
                '<section><h2>'+html.escape(label)+' · '+engine.upper()+'</h2>'
                '<p>'+html.escape(name)+' · 1024 × 1536</p>'
                '<a href="'+html.escape(name)+'"><img src="'+html.escape(name)+'" '
                'alt="'+html.escape(label)+' '+engine.upper()+'"></a></section>'
              )
          if len(records)!=8:
            raise SystemExit(f"Expected 8 renders, got {len(records)}")
          with open(os.path.join(out,"render_validation.json"),"w",encoding="utf-8") as f:
            json.dump(records,f,ensure_ascii=False,indent=2)
          page='''<!doctype html><html lang="zh-CN"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AriaIdol · 1024×1536 Preview</title>
          <style>body{margin:24px auto;padding:0 18px;max-width:1120px;background:#171b22;color:#edf1f7;font:16px system-ui}
          section{margin:28px 0 48px}img{display:block;width:100%;height:auto;border:1px solid #454d59;border-radius:8px}
          a{color:#9bc8ff}small{color:#aab3c0}</style>
          <h1>AriaIdol Blender 预检图 · 1024×1536</h1>
          <p>八张独立原图。不要用拼图判断细节；点击图片可单独打开原始 PNG。</p>
          '''+''.join(cards)+'''</html>'''
          with open(os.path.join(out,"index.html"),"w",encoding="utf-8") as f:
            f.write(page)
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
          cp scripts/aria_blender_ablation.py "$OUT/"
          cp "$GITHUB_WORKSPACE/glb_native_dn.blend" "$OUT/"
          cp "$GITHUB_WORKSPACE/results.json" "$OUT/"
          cat > "$OUT/实验说明_中文.md" <<'MD'
          # 爱芮 Blender 预检 · 八张独立原图（1024×1536）

          本轮只做人物 / 模型完整性与明显材质 bug 预检，不是最终 2K 成片。用户确认保留的方案才进入 2048×3072 或更高分辨率正式渲染。

          ## 八个方案
          | 方案 | 引擎 |
          |---|---|
          | PMX 基础材质 | EEVEE / Cycles |
          | PMX 分部位材质 | EEVEE / Cycles |
          | GLB 原始导入材质 | EEVEE / Cycles |
          | GLB 原生 D/N + 分部位材质 | EEVEE / Cycles |

          每张图单独输出为 PNG；不以缩小联系图替代原图。打开 `index.html` 可逐张查看。

          ## 灯光依据与边界
          研究报告实测网页使用两盏 DirectionalLight、AmbientLight、HemisphereLight，没有环境贴图；UI 默认主光方位角 38.7°、仰角 47.6°，曝光 0.9。本轮把主方向光与曝光按该默认值近似映射到 Blender，并用 World 节点渐变近似半球环境。
          第二盏方向光的具体方向 / 能量未从报告中恢复，因此使用低能量辅助方向光作为明确标注的近似值，不声称是游戏原值。Blender SUN 能量和网页 lightingIntensity 不是同一量纲。
          本轮仍是 Principled 材质路线的基线对照，不等于完整复刻游戏的 5-Pass / Toon / SDF / MatCap 渲染管线。

          ## 模型 / 材质处理
          - PMX：保留漫反射贴图和原始顶点法线；材质 diffuse.a 决定透明；髮+ 的 sphere_mode=2 加算叠层本轮排除，不能伪装成普通不透明 PBR。
          - GLB：保留导入材质作为基线；原生 D/N 方案按契约绑定 D 贴图；仅 body / hair 的 _LightTex 作为 RG 法线并重建 Z；face-sdf / eyes 的 _LightTex 是 SDF 数据，不接到 Normal 输入。
          - M/A/MatCap 不在本轮猜测映射。GLB 的面部 SDF、发影 stencil、描边壳尚未完整进入 Principled 基线。

          ## 渲染环境
          Blender 5.3.0；EEVEE 通过 Xvfb + Mesa llvmpipe 软件 OpenGL；Cycles CPU 8 samples + denoise；无物理 GPU。
          PNG 尺寸必须为 1024×1536。工作流会检查八张图是否存在、尺寸正确、文件非空并计算基本颜色统计；这不是自动视觉验收。相机焦距 80 mm，用于让全身主体在预检图中占更大画幅。为遵守 PMX 原作者的禁止二次配布声明，Artifact 不包含嵌入 PMX 网格的 .blend 工程；仅交付渲染图、脚本与记录。
          MD
          cat > "$OUT/ENVIRONMENT.txt" <<TXT
          Blender 5.3.0
          Runner: GitHub Actions ubuntu-latest
          Resolution: 1024 x 1536 (individual preview PNGs)
          Camera lens: 80 mm portrait framing
          EEVEE backend: Mesa llvmpipe software OpenGL under Xvfb
          Cycles: CPU, 8 samples, denoising enabled
          Website measured defaults used as Blender approximations: primary sun azimuth 38.7 deg, elevation 47.6 deg, exposure 0.9
          Secondary directional fill is provisional; exact source vector/intensity unavailable
          No physical GPU used
          TXT
          (cd "$OUT" && sha256sum *.png *.blend *.py *.json *.md *.txt *.html *.log > SHA256SUMS.txt)
          cd "$GITHUB_WORKSPACE"
          zip -qr aria-blender-preview-1024x1536.zip aria-ablation-out
          unzip -t aria-blender-preview-1024x1536.zip | tail -2
          sha256sum aria-blender-preview-1024x1536.zip
          ls -lh aria-blender-preview-1024x1536.zip aria-ablation-out/*.png

      - name: Upload eight independent preview renders
        uses: actions/upload-artifact@v4
        with:
          name: aria-blender-preview-1024x1536-${{ github.run_id }}
          path: |
            aria-blender-preview-1024x1536.zip
            aria-ablation-out/*.png
            aria-ablation-out/index.html
            aria-ablation-out/render_validation.json
            aria-ablation-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
